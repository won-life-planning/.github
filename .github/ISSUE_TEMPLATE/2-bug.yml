name: 버그
description: 동작이 예상과 다를 때 사용합니다.
title: "[버그] "
labels: ["bug"]
projects: ["won-life-planning/1"]
body:
  - type: markdown
    attributes:
      value: |
        테스트 케이스(TC)에서 발견한 버그라면 제목에 TC 번호를 넣어 주세요. 단위 테스트는 UT-번호, 종합 테스트는 IT-번호입니다. 예: `[버그] UT-12 0원 입력`
        테스트 탭에서 Fail 행을 선택하고 시트 메뉴 GitHub → 선택한 TC로 버그 이슈 만들기를 쓰면 내용이 자동으로 채워진 이슈가 만들어집니다.
  - type: dropdown
    id: wbs
    attributes:
      label: WBS 작업
      description: WBS 진척률 자동 계산에 쓰입니다.
      options:
        - 4.1 개발·배포 환경 세팅
        - 4.2 핵심 기능 개발 (백엔드)
        - 4.3 핵심 기능 개발 (프론트엔드)
        - 4.4 프론트·백엔드 연동
        - 4.5 부가 기능 개발
        - 4.6 CI/CD 및 인프라 구성, 모니터링
        - 5.1 단위 테스트
        - 5.2 종합 테스트 및 수정
        - 해당 없음
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      description: 단위·종합 테스트 탭의 이슈중요도와 같은 기준입니다.
      options:
        - "A: 서비스 불가, 즉시 수정"
        - "B: 일부 기능 오류"
        - "C: 사소한 문구·화면 오류"
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 증상
      placeholder: "예: 배포 서버에서만 분석 API가 500 에러"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과 / 실제 결과
      value: |
        - 기대: 
        - 실제: 
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경과 스크린샷
      description: 로컬/배포 서버, 브라우저, 에러 로그 등. 로그의 키·비밀번호는 가리고 붙여 주세요.
  - type: markdown
    attributes:
      value: |
        ---
        **해결한 뒤에는 이 이슈에 댓글로 아래 세 가지를 남기고, 노션 '문제 해결 리포트'에도 한 줄 적어 주세요.** (발표 자료에 들어갑니다)
        - 원인
        - 해결 방법
        - 다시 안 겪으려면

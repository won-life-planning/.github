name: 📖 문서 작업
description: 레포 안의 문서(README, API 문서, AGENTS.md, 주석) 작업에 사용합니다. 산출물 시트 작업은 WBS에서 관리합니다.
title: "[문서] "
labels: ["docs"]
projects: ["won-life-planning/3"]
body:
  - type: dropdown
    id: wbs
    attributes:
      label: WBS 작업
      description: WBS 진척률 자동 계산에 쓰입니다.
      options:
        - 3.1 Github, Figma 페이지 생성
        - 3.2 사용자 인터페이스(화면) 설계
        - 3.3 DB 설계(ERD) 및 DB 명세서
        - 3.4 시스템 아키텍처 설계
        - 3.5 API 명세 작성
        - 4.1 개발·배포 환경 세팅
        - 4.2 핵심 기능 개발 (백엔드)
        - 4.3 핵심 기능 개발 (프론트엔드)
        - 4.4 프론트·백엔드 연동
        - 4.5 부가 기능 개발
        - 4.6 CI/CD 및 인프라 구성, 모니터링
        - 5.1 단위 테스트
        - 5.2 종합 테스트 및 수정
        - 해당 없음
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 어떤 문서를 작성·수정하나요?
      placeholder: "예: backend README에 로컬 실행 방법과 환경 변수 목록 추가"
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ] 
    validations:
      required: true

name: 리팩터링
description: 동작은 그대로 두고 코드 구조를 개선할 때 사용합니다.
title: "[리팩터링] "
labels: ["refactor"]
projects: ["won-life-planning/1"]
body:
  - type: markdown
    attributes:
      value: |
        12/2(M2 마감) 이후에는 여러 파일에 걸친 큰 리팩터링을 하지 않습니다. 꼭 필요하면 PL과 먼저 상의해 주세요.
  - type: dropdown
    id: wbs
    attributes:
      label: WBS 작업
      description: WBS 진척률 자동 계산에 쓰입니다.
      options:
        - 4.1 개발·배포 환경 세팅
        - 4.2 핵심 기능 개발 (백엔드)
        - 4.3 핵심 기능 개발 (프론트엔드)
        - 4.4 프론트·백엔드 연동
        - 4.5 부가 기능 개발
        - 4.6 CI/CD 및 인프라 구성, 모니터링
        - 5.1 단위 테스트
        - 5.2 종합 테스트 및 수정
        - 해당 없음
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 무엇을, 왜 바꾸나요?
      placeholder: "예: 분석 서비스에 섞여 있는 현금화 일정 계산을 별도 클래스로 분리 (테스트 작성이 어려움)"
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 바뀌는 파일·API와 다른 팀원 작업에 영향이 있는지 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 확인
      options:
        - label: 기존 테스트가 리팩터링 후에도 그대로 통과하는지 확인합니다.

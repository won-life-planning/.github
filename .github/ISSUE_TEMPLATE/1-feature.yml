name: ✨ 기능 개발
description: 새 기능, 화면, API를 만들 때 사용합니다. 프론트와 백엔드는 이슈를 나눠 만들고 서로 링크해 주세요.
title: "[기능] P00 "
labels: ["feature"]
projects: ["won-life-planning/3"]
body:
  - type: markdown
    attributes:
      value: |
        제목에 서비스 흐름 번호를 넣어 주세요. 예: `[기능] P06-2 긴급 지출 등록 API`
        로그인, 공통 응답 형식처럼 특정 흐름에 속하지 않으면 `공통`이라고 적어요. 예: `[기능] 공통 JWT 로그인`
        만든 뒤 파트 라벨(FE/BE/AI/DB), 담당자, 마일스톤을 지정해 주세요.
  - type: dropdown
    id: wbs
    attributes:
      label: WBS 작업
      description: WBS 진척률 자동 계산에 쓰입니다.
      options:
        - 4.1 개발·배포 환경 세팅
        - 4.2 핵심 기능 개발 (백엔드)
        - 4.3 핵심 기능 개발 (프론트엔드)
        - 4.4 프론트·백엔드 연동
        - 4.5 부가 기능 개발
        - 4.6 CI/CD 및 인프라 구성, 모니터링
        - 5.1 단위 테스트
        - 5.2 종합 테스트 및 수정
        - 해당 없음
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 무엇을 만드나요?
      placeholder: "예: 기존 사용자가 긴급 지출(금액·날짜·목적)을 등록하는 API"
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: 할 일
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 어떻게 되면 끝난 건지 확인할 수 있게 적어 주세요.
      placeholder: "예: 0원 이하나 과거 날짜를 입력하면 400 응답, 정상 입력 시 저장 후 분석 화면으로 이동"
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 연결된 이슈
      description: 짝이 되는 프론트·백엔드 이슈나 먼저 끝나야 하는 이슈
      placeholder: "예: 프론트 화면 #31, 선행 작업 #12"
